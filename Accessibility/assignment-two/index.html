<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persistent Navigation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- skip link helps keyboard users to move to main content without tabbing through all navigation links -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- global header wraps both utility and main navigation menus -->
    <header class="global-header">
      <!-- utility menu -->
      <!-- aria-label provides name for screen readers - Utility navigation -->
      <nav class="utility-menu" aria-label="Utility Navigation">
        <ul>
          <li><a href="#">Support</a></li>
          <li><a href="#">Careers</a></li>
          <li><a href="#">Global Locations</a></li>
        </ul>
      </nav>

      <!-- main header -->
      <div class="main-header">
        <a href="#" class="logo">Persistent</a>
        <!-- main menu -->
        <nav aria-label="Main Navigation">
          <ul class="main-menu">
            <li><a href="#">Services</a></li>
            <li><a href="#">Our Work</a></li>
            <li><a href="#">Insights</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- main content -->
    <main id="main-content" class="main-content">
      <h1>Welcome to Persistent</h1>
      <p>This is the main content.</p>
      <a href="#" class="btn">Get in Touch</a>
    </main>

    <script src="script.js"></script>
  </body>
</html>
