<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procurement Channels</title>

    <!--Importing Inter font from Google Fonts with weight 400 only -->
    <!-- display=swap shows system font first while Inter loads, then use Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Main Procurement Channels Section -->
    <section class="procurement">
      <!-- label and heading -->
      <div class="procurement__header">
        <p class="procurement__label">Get Started</p>
        <h2 class="procurement__heading">Procurement Channels</h2>
      </div>

      <!-- logo cards in row -->
      <div class="procurement__cards">
        <!-- aws marketplace card -->
        <div class="card">
          <img
            class="card__logo"
            src="images/card1-img.png"
            alt="AWS Marketplace"
          />
        </div>

        <!-- hgac buy card -->
        <div class="card">
          <img class="card__logo" src="images/card2-img.png" alt="HGACBuy" />
        </div>

        <!-- marketplace city card -->
        <div class="card">
          <img
            class="card__logo"
            src="images/card3-img.png"
            alt="Marketplace City"
          />
        </div>
      </div>
    </section>
  </body>
</html>
