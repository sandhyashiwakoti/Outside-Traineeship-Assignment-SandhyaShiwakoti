<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 2 - Spacing & Responsive Padding</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- main section that contains all cards -->
    <div class="section">
      <!-- m-1 = 4px margin -->
      <div class="card m-1">
        <h2>Card One</h2>
        <p>margin: 4px (m-1)</p>
      </div>

      <!-- m-2 = 8px margin -->
      <div class="card m-2">
        <h2>Card Two</h2>
        <p>margin: 8px (m-2)</p>
      </div>

      <!-- m-3 = 16px margin -->
      <div class="card m-3">
        <h2>Card Three</h2>
        <p>margin: 16px (m-3)</p>
      </div>

      <!-- m-4 = 24px margin -->
      <div class="card m-4">
        <h2>Card Four</h2>
        <p>margin: 24px (m-4)</p>
      </div>

      <!-- m-5 = 32px margin -->
      <div class="card m-5">
        <h2>Card Five</h2>
        <p>margin: 32px (m-5)</p>
      </div>

      <!-- m-6 = 48px margin -->
      <div class="card m-6">
        <h2>Card Six</h2>
        <p>margin: 48px (m-6)</p>
      </div>
    </div>
  </body>
</html>
