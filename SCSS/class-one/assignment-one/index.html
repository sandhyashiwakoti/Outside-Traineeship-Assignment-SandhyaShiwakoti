<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 1 - Button System</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- variant buttons -->
    <div class="btn-group">
      <button class="btn-primary">Primary</button>
      <button class="btn-danger">Danger</button>
      <button class="btn-ghost">Ghost</button>
    </div>

    <!-- size buttons -->
    <div class="btn-group">
      <button class="btn-primary btn-sm">Small</button>
      <!-- medium - default, no class needed -->
      <button class="btn-primary">Medium</button>
      <button class="btn-primary btn-lg">Large</button>
    </div>

    <!-- disabled state -->
    <div class="btn-group">
      <button class="btn-primary" disabled>Disabled Primary</button>
      <button class="btn-danger" disabled>Disabled Danger</button>
      <button class="btn-ghost" disabled>Disabled Ghost</button>
    </div>
  </body>
</html>
