<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment One - Offcanvas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <span class="logo">LOGO</span>

      <button class="toggle-btn" id="toggleBtn">
        <!-- hamburger icon shown by default -->
        <span class="icon hamburger" id="hamburgerIcon">&#9776;</span>
        <!-- close icon hidden by default -->
        <span class="icon close" id="closeIcon">&#10005;</span>
      </button>
    </nav>

    <!-- Content -->
    <div class="content-area">
      <!-- offcanvas sidebar -->
      <div class="off-canvas" id="offcanvas">
        <p>OFF-CANVAS<br />SIDEBAR</p>
      </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
