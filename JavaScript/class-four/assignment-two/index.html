<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Two - Scroll Animation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- top section -->
    <section class="hero">
      <h1>Scroll down to see the boxes</h1>
    </section>

    <!-- box section -->
    <section class="box-section">
      <!-- box 1: rotates only once -->
      <div class="box green-box" id="box1">Rotate Once</div>

      <!-- box 2: rotates every time it enters viewport -->
      <div class="box orange-box" id="box2">Rotate Every Time</div>
    </section>

    <!-- script -->
    <script src="script.js"></script>
  </body>
</html>
